name: saglixen
description: "Saglixen health app"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8

  # Networking
  http: ^1.6.0

  # Functional Programming
  dartz: ^0.10.1
  kt_dart: ^1.1.0

  # Local Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.0.0
  uuid: ^4.5.3
  get_it: ^9.2.1
  flutter_animate: ^4.5.2
  google_fonts: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/saglix_icon_1024x1024.png"  # senin logo path'in ne ise
  min_sdk_android: 21
  remove_alpha_ios: true  
  


flutter:
  uses-material-design: true

  
  
  assets:
    - assets/images/
  