name: saglixen
description: "Saglixen health app"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8

  # Networking
  http: ^1.6.0

  # Functional Programming
  dartz: ^0.10.1
  kt_dart: ^1.1.0

  # Local Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.0.0
  uuid: ^4.5.3
  get_it: ^9.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true